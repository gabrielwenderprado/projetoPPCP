<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>NEXT Implementos — Carregando</title>
<style>
@font-face {
  font-family: 'Barlow Condensed';
  src: local('Barlow Condensed');
}
:root {
  --next-red: #E31E24;
  --next-black: #161616;
  --next-orange: #F5821F;
  --steel: #cfd3d6;
  --steel-dark: #8a9096;
  --white: #ffffff;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: radial-gradient(ellipse at 50% 30%, #232323 0%, var(--next-black) 70%);
  overflow: hidden;
  font-family: 'Oswald', 'Barlow Condensed', 'Arial Narrow', sans-serif;
}
.stage {
  position: relative;
  width: 100%; height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}


/* roadside utility poles and power lines */
.scenery {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.9;
}
.scenery svg { width: 100%; height: 100%; }
.pole-left, .pole-right { animation: poleGlow 2.8s ease-in-out infinite; }
.pole-right { animation-delay: 1.4s; }
.power-wire {
  stroke: #5f6367;
  stroke-width: 1.4;
  fill: none;
  opacity: 0.7;
}
.power-wire-thin {
  stroke: #777b7f;
  stroke-width: 0.8;
  fill: none;
  opacity: 0.45;
}
@keyframes poleGlow {
  0%, 100% { opacity: 0.72; }
  50% { opacity: 1; }
}
.road-mark {
  animation: roadDash 2.2s linear infinite;
}
@keyframes roadDash {
  from { transform: translateX(0); }
  to { transform: translateX(-80px); }
}

/* asphalt floor line */
.floor {
  position: absolute;
  bottom: 14%;
  left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--steel-dark) 15%, var(--steel-dark) 85%, transparent);
  opacity: 0.5;
}

/* hazard stripe bar top+bottom, like the truck's outrigger pads */
.hazard-bar {
  position: absolute;
  left: 0; right: 0;
  height: 10px;
  background: repeating-linear-gradient(
    135deg,
    var(--next-orange) 0 18px,
    var(--next-black) 18px 36px
  );
  opacity: 0.9;
}
.hazard-bar.top { top: 0; }
.hazard-bar.bottom { bottom: 0; }

.crane-wrap {
  position: relative;
  width: 340px;
  height: 380px;
  margin-bottom: 18px;
}

svg { width: 100%; height: 100%; overflow: visible; }

/* pivot groups animate rotation; nested so bucket follows naturally */
.lower-arm {
  transform-box: fill-box;
  transform-origin: 92px 250px;
  animation: raiseLower 4.2s ease-in-out infinite;
}
.upper-arm {
  transform-box: fill-box;
  transform-origin: 92px 250px; /* overridden inline per element, kept for safety */
  animation: raiseLowerUpper 4.2s ease-in-out infinite;
}

@keyframes raiseLower {
  0%   { transform: rotate(0deg); }
  45%  { transform: rotate(-52deg); }
  55%  { transform: rotate(-52deg); }
  100% { transform: rotate(0deg); }
}
@keyframes raiseLowerUpper {
  0%   { transform: rotate(0deg); }
  45%  { transform: rotate(-38deg); }
  55%  { transform: rotate(-38deg); }
  100% { transform: rotate(0deg); }
}

.bucket-sway {
  transform-box: fill-box;
  transform-origin: center;
  animation: sway 4.2s ease-in-out infinite;
}
@keyframes sway {
  0%   { transform: rotate(0deg); }
  45%  { transform: rotate(4deg); }
  55%  { transform: rotate(4deg); }
  100% { transform: rotate(0deg); }
}

.logo-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  opacity: 0;
  animation: fadeUp 0.9s ease-out 0.5s forwards;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
.logo-block img {
  height: 54px;
  filter: drop-shadow(0 6px 14px rgba(227,30,36,0.25));
}

.tagline {
  color: var(--steel);
  font-size: 13px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  font-weight: 500;
  margin: 0;
}

.progress-wrap {
  margin-top: 26px;
  width: 220px;
}
.progress-track {
  position: relative;
  width: 100%;
  height: 6px;
  background: #333;
  border-radius: 3px;
  overflow: hidden;
  border: 1px solid #444;
}
.progress-fill {
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 40%;
  background: repeating-linear-gradient(
    135deg,
    var(--next-red) 0 10px,
    var(--next-orange) 10px 20px
  );
  border-radius: 3px;
  animation: load 2.4s ease-in-out infinite;
}
@keyframes load {
  0%   { width: 6%; }
  50%  { width: 92%; }
  100% { width: 6%; }
}
.loading-text {
  margin-top: 10px;
  text-align: center;
  color: var(--steel-dark);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
</style>
</head>
<body>
<div class="stage">
  <!-- industrial roadside background -->
  <div class="scenery" aria-hidden="true">
    <svg viewBox="0 0 1200 800" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">

          <stop offset="1" stop-color="#111" stop-opacity="0.9"/>
        </linearGradient>
        <filter id="softGlow">
          <feGaussianBlur stdDeviation="5"/>

        <line x1="1028" y1="181" x2="1102" y2="181" stroke="#85898d" stroke-width="6"/>

        <rect x="1056" y="510" width="18" height="5" fill="#3c3f42"/>
      </g>

      <!-- power lines, slightly sagged for realism -->
      <path class="power-wire" d="M102 201 Q600 285 1028 177"/>
      <path class="power-wire" d="M112 184 Q600 265 1039 160"/>
      <path class="power-wire-thin" d="M158 201 Q600 310 1091 177"/>

      <!-- road edge and moving lane dashes -->
      <path d="M0 590 Q600 545 1200 590" stroke="#666" stroke-width="2" fill="none" opacity="0.35"/>
      <g class="road-mark" opacity="0.35">
        <rect x="80" y="640" width="70" height="4" rx="2" fill="#a4a7a9"/>
        <rect x="280" y="635" width="70" height="4" rx="2" fill="#a4a7a9"/>
        <rect x="480" y="630" width="70" height="4" rx="2" fill="#a4a7a9"/>
        <rect x="680" y="625" width="70" height="4" rx="2" fill="#a4a7a9"/>
        <rect x="880" y="620" width="70" height="4" rx="2" fill="#a4a7a9"/>
        <rect x="1080" y="615" width="70" height="4" rx="2" fill="#a4a7a9"/>
      </g>
    </svg>
  </div>

  <div class="hazard-bar top"></div>
  <div class="hazard-bar bottom"></div>
  <div class="floor"></div>

  <div class="crane-wrap" style="z-index:2;">
    <svg viewBox="0 0 340 380" xmlns="http://www.w3.org/2000/svg">
      <!-- truck body (simplified) -->
      <g>
        <rect x="30" y="255" width="220" height="55" rx="6" fill="#e9e9e9"/>
        <rect x="30" y="255" width="220" height="14" rx="4" fill="var(--next-red)"/>
        <rect x="235" y="215" width="55" height="95" rx="6" fill="#f2f2f2"/>
        <rect x="235" y="215" width="55" height="14" rx="4" fill="var(--next-black)"/>
        <circle cx="70" cy="312" r="16" fill="#1c1c1c"/>
        <circle cx="70" cy="312" r="6" fill="#666"/>
        <circle cx="215" cy="312" r="16" fill="#1c1c1c"/>
        <circle cx="215" cy="312" r="6" fill="#666"/>
        <!-- windshield -->
        <path d="M240 220 L275 220 L282 250 L240 250 Z" fill="#a9c9d8" opacity="0.85"/>
        <!-- NEXT lettering on the body panel -->
        <text x="140" y="288" text-anchor="middle" font-family="'Oswald','Arial Narrow',sans-serif"
              font-weight="700" font-style="italic" font-size="19" letter-spacing="1"
              fill="var(--next-black)">NEXT</text>
        <polygon points="86,279 100,279 91,289" fill="var(--next-red)"/>
      </g>

      <!-- outrigger legs w/ hazard feet -->
      <g>
        <rect x="38" y="308" width="6" height="34" fill="#555"/>
        <polygon points="30,342 52,342 41,356" fill="var(--next-orange)"/>
        <rect x="150" y="308" width="6" height="34" fill="#555"/>
        <polygon points="142,342 164,342 153,356" fill="var(--next-orange)"/>
      </g>

      <!-- crane base pivot -->
      <rect x="72" y="238" width="40" height="20" rx="3" fill="var(--next-black)"/>
      <circle cx="92" cy="250" r="9" fill="#3a3a3a" stroke="#111" stroke-width="2"/>

      <!-- LOWER ARM (rotates) -->
      <g class="lower-arm">
        <rect x="86" y="118" width="14" height="140" rx="6" fill="var(--next-orange)" stroke="#b85c0f" stroke-width="1.5"/>
        <rect x="86" y="118" width="14" height="140" rx="6" fill="url(#armShine)"/>

        <!-- UPPER ARM (nested, rotates relative to lower) -->
        <g class="upper-arm" style="transform-origin: 92px 128px;">
          <rect x="86" y="6" width="12" height="128" rx="5" fill="#f2f2f2" stroke="#b9b9b9" stroke-width="1.5"/>

          <!-- bucket -->
          <g class="bucket-sway" style="transform-origin: 92px 8px;">
            <rect x="66" y="-24" width="52" height="40" rx="6" fill="#eceff1" stroke="#9aa0a5" stroke-width="2"/>
            <rect x="66" y="-24" width="52" height="10" rx="4" fill="var(--next-black)"/>
            <rect x="80" y="-8" width="24" height="4" fill="#b8bcbf"/>
          </g>
        </g>
      </g>

      <defs>
        <linearGradient id="armShine" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
          <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
          <stop offset="1" stop-color="#000000" stop-opacity="0.15"/>
        </linearGradient>
      </defs>
    </svg>
  </div>
